<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行研｜提示詞管理平台</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PapaParse for Google Sheets CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap');

    :root{
      --ink: #1B1F27;
      --ink-soft: #3A3F4B;
      --ivory: #F6F3EC;
      --card: #FFFFFF;
      --gold: #A9834C;
      --gold-deep: #8C6A38;
      --gold-tint: #F1E7D3;
      --hairline: #E3DCC9;
      --muted: #8B8474;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--ivory);
      background-image:
        radial-gradient(circle at 100% 0%, rgba(169,131,76,0.06), transparent 45%),
        radial-gradient(circle at 0% 100%, rgba(27,31,39,0.04), transparent 40%);
    }

    .font-display { font-family: 'Noto Serif TC', serif; }
    .font-accent { font-family: 'Cormorant Garamond', 'Noto Serif TC', serif; }

    .eyebrow {
      font-family: 'Cormorant Garamond', serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* Custom Scrollbar for Prompt Text Preview */
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1efe8; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #d8cfb8; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--gold); }

    /* Signature: thin brass rule on top of card, deepens on hover */
    .card-gold-rule { position: relative; }
    .card-gold-rule::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold-tint), var(--gold) 50%, var(--gold-tint));
      opacity: 0.55;
      transition: opacity 0.25s ease;
    }
    .card-gold-rule:hover::before { opacity: 1; }

    .brand-underline {
      background-image: linear-gradient(var(--gold), var(--gold));
      background-repeat: no-repeat;
      background-position: left bottom 2px;
      background-size: 100% 1px;
    }

    .tab-btn { position: relative; }
    .tab-btn.active { color: var(--ink); }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      left: 10%; right: 10%; bottom: -1px;
      height: 2px;
      background: var(--gold);
    }

    .filter-pill { letter-spacing: 0.02em; }
  </style>
</head>
<body class="text-[var(--ink-soft)] antialiased min-h-screen flex flex-col pb-12">

  <!-- Top Navigation Header -->
  <header class="bg-[var(--ivory)]/95 backdrop-blur border-b border-[var(--hairline)] sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <!-- Logo / Wordmark -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full border border-[var(--gold)] flex items-center justify-center">
          <span class="font-accent italic text-[var(--gold-deep)] text-lg leading-none">A</span>
        </div>
        <div class="leading-tight">
          <h1 class="font-display text-lg sm:text-xl font-bold text-[var(--ink)] tracking-wide">
            AI 工作站
          </h1>
          <p class="eyebrow text-[10px] text-[var(--gold-deep)]">Prompt Library &amp; Archive</p>
        </div>
      </div>

      <!-- Main Navigation Tabs -->
      <nav class="flex items-center gap-5 sm:gap-8 h-full">
        <button id="tab-single" class="tab-btn active h-full flex items-center gap-1.5 text-sm font-medium text-[var(--ink)] transition-colors">
          <i class="fa-solid fa-folder-closed text-xs text-[var(--gold)]"></i>
          <span>單項提示詞</span>
        </button>
        <button id="tab-flow" class="tab-btn h-full flex items-center gap-1.5 text-sm font-medium text-[var(--muted)] hover:text-[var(--ink)] transition-colors">
          <i class="fa-solid fa-bolt text-xs text-[var(--gold)]"></i>
          <span>流程提示詞</span>
        </button>
        <button id="tab-workflow" class="tab-btn h-full flex items-center gap-1.5 text-sm font-medium text-[var(--muted)] hover:text-[var(--ink)] transition-colors">
          <i class="fa-solid fa-folder-open text-xs text-[var(--gold)]"></i>
          <span>工作流檔案</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 flex-grow w-full">

    <!-- Search Bar -->
    <div class="mb-5">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-[var(--gold)]">
          <i class="fa-solid fa-magnifying-glass text-sm"></i>
        </div>
        <input 
          type="text" 
          id="search-input" 
          placeholder="搜尋提示詞名稱、任務或內容關鍵字..." 
          class="w-full pl-11 pr-10 py-3.5 bg-[var(--card)] border border-[var(--hairline)] rounded-md text-[var(--ink)] placeholder-[var(--muted)] focus:outline-none focus:ring-1 focus:ring-[var(--gold)] focus:border-[var(--gold)] shadow-sm transition text-sm sm:text-base"
        >
        <button id="clear-search" class="hidden absolute inset-y-0 right-0 pr-4 flex items-center text-[var(--muted)] hover:text-[var(--ink)]">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- Filter Control Box -->
    <div class="bg-[var(--card)] border border-[var(--hairline)] rounded-md p-5 shadow-sm space-y-4 mb-6">
      
      <!-- 主軸 (Categories) -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
        <span class="eyebrow text-xs text-[var(--gold-deep)] w-16 shrink-0">主軸</span>
        <div id="filter-category" class="flex flex-wrap gap-2">
          <!-- Filter pills injected dynamically -->
        </div>
      </div>

      <!-- 模式 (Mode) -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 border-t border-[var(--hairline)] pt-3">
        <span class="eyebrow text-xs text-[var(--gold-deep)] w-16 shrink-0">模式</span>
        <div id="filter-mode" class="flex flex-wrap gap-2">
          <!-- Filter pills injected dynamically -->
        </div>
      </div>

      <!-- AI工具 (AI Tools) -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 border-t border-[var(--hairline)] pt-3">
        <span class="eyebrow text-xs text-[var(--gold-deep)] w-16 shrink-0">AI工具</span>
        <div id="filter-tool" class="flex flex-wrap gap-2">
          <!-- Filter pills injected dynamically -->
        </div>
      </div>

    </div>

    <!-- Prompt Count & Status Indicator -->
    <div class="flex flex-wrap items-center justify-between gap-2 mb-4 px-1">
      <div class="text-sm font-medium text-[var(--ink)] flex items-center gap-2 flex-wrap">
        <span>共 <strong id="prompt-count" class="text-[var(--gold-deep)] font-display text-base">0</strong> 個提示詞</span>
        <span id="loading-spinner" class="hidden inline-flex items-center text-xs text-[var(--muted)] ml-1">
          <i class="fa-solid fa-circle-notch fa-spin mr-1 text-[var(--gold)]"></i> 資料同步中...
        </span>
        <span id="sync-status" class="hidden items-center text-xs text-[var(--muted)] ml-1"></span>
      </div>
      <button id="sync-sheet-btn" class="text-xs text-[var(--ink-soft)] hover:text-[var(--gold-deep)] flex items-center gap-1.5 bg-[var(--card)] border border-[var(--hairline)] px-3 py-1.5 rounded-md transition hover:border-[var(--gold)] hover:shadow-sm">
        <i class="fa-solid fa-rotate text-[var(--gold)]"></i> 重新載入 Google Sheet
      </button>
    </div>

    <!-- Prompt Cards Grid -->
    <div id="prompts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
      <!-- Dynamic Card Elements inserted via JavaScript -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-16 bg-[var(--card)] rounded-md border border-dashed border-[var(--hairline)] my-4">
      <i class="fa-solid fa-folder-open text-4xl text-[var(--gold-tint)] mb-3"></i>
      <p class="text-[var(--muted)] font-medium">沒有找到符合條件的提示詞</p>
      <button id="reset-filters-btn" class="mt-3 text-xs bg-[var(--gold-tint)] text-[var(--gold-deep)] px-3 py-1.5 rounded-md hover:bg-[var(--gold)] hover:text-white transition">
        重設所有篩選條件
      </button>
    </div>

  </main>

  <!-- Prompt Detail Modal -->
  <div id="modal-backdrop" class="fixed inset-0 bg-[var(--ink)]/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity opacity-0">
    <div id="modal-box" class="bg-[var(--card)] rounded-md max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden transform scale-95 transition-all border border-[var(--hairline)]">
      <div class="px-6 py-4 border-b border-[var(--hairline)] flex items-center justify-between bg-[var(--ivory)]">
        <div>
          <span id="modal-category" class="eyebrow text-xs text-[var(--gold-deep)] block"></span>
          <h3 id="modal-title" class="font-display text-lg font-bold text-[var(--ink)]"></h3>
        </div>
        <button id="close-modal-btn" class="text-[var(--muted)] hover:text-[var(--ink)] p-2 rounded-md">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="modal-tags" class="px-6 py-2 flex flex-wrap gap-1.5 border-b border-[var(--hairline)] bg-[var(--card)]">
        <!-- Modal tags inserted here -->
      </div>
      <div class="p-6 overflow-y-auto custom-scrollbar flex-grow bg-[var(--ivory)]/60">
        <pre id="modal-content" class="whitespace-pre-wrap font-sans text-sm text-[var(--ink-soft)] leading-relaxed bg-[var(--card)] p-4 rounded-md border border-[var(--hairline)] select-all"></pre>
      </div>
      <div class="px-6 py-3 border-t border-[var(--hairline)] bg-[var(--card)] flex justify-end space-x-2">
        <button id="modal-copy-btn" class="bg-[var(--ink)] hover:bg-[var(--gold-deep)] text-white font-medium text-sm px-4 py-2 rounded-md flex items-center gap-1.5 shadow-sm transition">
          <i class="fa-regular fa-copy"></i>
          <span>複製完整 Prompt</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 bg-[var(--ink)] text-white text-sm px-4 py-3 rounded-md shadow-xl flex items-center space-x-2 transform translate-y-20 opacity-0 transition-all z-50">
    <i class="fa-solid fa-circle-check text-[var(--gold)]"></i>
    <span id="toast-msg">已成功複製到剪貼簿！</span>
  </div>

  <script>
    // Fallback Mock Data matching exact items in screenshot + additional items
    const MOCK_DATA = [
      {
        id: "049",
        title: "049-線上課程",
        category: "筆記",
        subCategory: "筆記整理",
        mode: "AI 助理",
        tools: ["ChatGPT", "Gemini AI"],
        content: `【角色設定】
你是一位專精於「學習科學」與「知識管理」的 AI 助教。擅長將混亂的課程投影影片（截圖 PDF）轉化為具備邏輯、易於日後複習的高價值筆記。

【任務目標】
請分析我上傳的 PDF 檔案（由線上課程截圖組成），執行 OCR 文字辨識並進行深度擷取。請針對每一組邏輯相關的內容，自動判斷最適合的整理格式：

觀念/理論型內容：使用「黃金圈法則 (Why/How/What)」解析。`
      },
      {
        id: "050",
        title: "050-線上課程",
        category: "筆記",
        subCategory: "筆記整理",
        mode: "AI 助理",
        tools: ["ChatGPT", "Gemini AI"],
        content: `【角色設定】
你是一位專精於「學習科學」與「知識管理」的 AI 助教。擅長將混亂的課程投影影片（截圖 PDF）轉化為具備邏輯、易於日後複習的高價值筆記。

【任務目標】
請分析我上傳的 PDF 檔案（由線上課程截圖組成），進行文字辨識與整理。請針對內容，自動判斷最適合的整理格式。

並於最後一段，擷取職場可以應用的三個重點，以條列式來呈現。`
      },
      {
        id: "051",
        title: "051-長篇文章",
        category: "筆記",
        subCategory: "筆記精煉",
        mode: "AI 協做",
        tools: ["ChatGPT", "Gemini AI"],
        content: `為這一篇長篇文章，進行以下四個步驟，每一個步驟都要提供給文章與標示出來：
第1、請為這篇長文生成一份體短摘要。
第2、請基於上一個摘要，不要遺漏任何專有名詞、數字或關鍵人物，重新生成一份摘要。
第3、現在，請將摘要中每一句話都濃縮成更簡潔的表達，同時保留所有事實，讓它擴起來更像新聞標題。
第4、最後，請確保摘要能獨立解釋所有提到的概念，無需參照原文。

### 長文如下：`
      },
      {
        id: "052",
        title: "052-提取練習",
        category: "筆記",
        subCategory: "筆記精煉",
        mode: "AI 協思",
        tools: ["ChatGPT", "Gemini AI", "Claude AI"],
        content: `我剛讀完了關於 [填入具體段落標題] 的內容。現在請幫我進行深度研磨：

1-底層邏輯拷問：針對這段內容的「運作原理」向我提問，測試我是否理解了「為什麼有效」，而非只是記住步驟。

2-隱喻轉化：如果這段概念有複雜的故事，請幫我將其轉化為一個 50 字以內的「關鍵隱喻」或「原則案例」。

3-邏輯連動：這段內容與附件中之前的 [填入章節]`
      },
      {
        id: "053",
        title: "053-Python 腳本寫作",
        category: "程式",
        subCategory: "程式開發",
        mode: "AI 助理",
        tools: ["ChatGPT", "Claude AI"],
        content: `你是一位資深的 Python 全棧工程師。請幫我設計一個具備完整錯誤處理與註解的數據處理腳本。

【需求】
1. 讀取 CSV / Excel 檔案
2. 清理缺失值與異常數據
3. 輸出乾淨的 JSON 數據結構`
      },
      {
        id: "054",
        title: "054-簡報大綱設計",
        category: "簡報",
        subCategory: "簡報企劃",
        mode: "AI 協做",
        tools: ["NotebookLM", "Gemini AI"],
        content: `【任務】
為一場 15 分鐘的商業提案簡報擬定架構大綱。

【簡報目標】
向客戶高層展示新產品的投資回報率 (ROI) 與導入時程。請以 10 頁 Slide 為限，每頁說明「標題、核心訊息、建議視覺呈現元素」。`
      }
    ];

    // Google Sheet source (spreadsheet ID + gid come from the shared sheet URL).
    // gviz endpoint exports the given tab (gid) as CSV so PapaParse can read it directly.
    // NOTE: the sheet must be shared as "Anyone with the link can view" or this fetch will fail.
    const SHEET_ID = "1C9xqJVVjnlpogR7PcRk_myY2Vc0qvz55A1ZlbKLvj5k";
    const SHEET_GID = "1480282197";
    const GOOGLE_SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}&_ts=${Date.now()}`;

    // Application state
    let rawPrompts = [];
    let filteredPrompts = [];
    let selectedCategory = "全部";
    let selectedMode = "全部";
    let selectedTool = "全部";
    let searchQuery = "";
    let dataSource = "sheet"; // "sheet" | "fallback"

    // Filter option lists — repopulated dynamically from whichever dataset loads
    // (live Google Sheet data if available, otherwise the fallback dataset).
    let CATEGORIES = ["全部", "寫作", "心圖", "示範", "校正", "秘訣", "程式", "筆記", "貼文", "整理", "簡報"];
    let MODES = ["全部", "AI 助理", "AI 協做", "AI 協思"];
    let TOOLS = ["全部", "ChatGPT", "Gemini Canvas", "NotebookLM", "Gemini AI", "Claude AI"];

    document.addEventListener("DOMContentLoaded", () => {
      renderFilterButtons();
      fetchPromptData();
      setupEventListeners();
    });

    // Fetch data from Google Sheets (live sync), falling back to the bundled dataset on failure.
    function fetchPromptData() {
      const spinner = document.getElementById("loading-spinner");
      const statusEl = document.getElementById("sync-status");
      spinner.classList.remove("hidden");
      statusEl.classList.add("hidden");

      Papa.parse(GOOGLE_SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          spinner.classList.add("hidden");

          const rows = results.data || [];
          const firstRow = rows[0];
          const looksValid = rows.length > 0 && firstRow &&
            (firstRow.title || firstRow.Title || firstRow["提示詞名稱"] || firstRow["名稱"]);

          if (looksValid) {
            rawPrompts = rows.map((row, idx) => {
              const title = row['title'] || row['Title'] || row['提示詞名稱'] || row['名稱'] || `提示詞-${idx + 1}`;
              const category = row['category'] || row['Category'] || row['主軸'] || "筆記";
              const subCategory = row['subCategory'] || row['SubCategory'] || row['分類'] || "通用";
              const mode = row['mode'] || row['Mode'] || row['模式'] || "AI 助理";
              const toolsStr = row['tools'] || row['Tools'] || row['AI工具'] || row['工具'] || "ChatGPT,Gemini AI";
              const content = row['content'] || row['Content'] || row['提示詞內容'] || row['內容'] || "";
              const idRaw = row['id'] || row['ID'] || row['編號'];

              const tools = typeof toolsStr === 'string'
                ? toolsStr.split(/[,/、]\s*/).map(t => t.trim()).filter(Boolean)
                : [toolsStr];

              return {
                id: String(idRaw || (idx + 1)).padStart(3, '0'),
                title,
                category,
                subCategory,
                mode,
                tools,
                content
              };
            });
            dataSource = "sheet";
            showSyncStatus(true, rawPrompts.length);
          } else {
            console.log("Sheet empty or structure unreadable, using fallback dataset.");
            rawPrompts = MOCK_DATA;
            dataSource = "fallback";
            showSyncStatus(false);
          }

          deriveFilterOptions();
          renderFilterButtons();
          applyFilters();
        },
        error: (err) => {
          console.warn("Failed to fetch Google Sheet CSV (network/CORS/permissions). Loading preset library.", err);
          spinner.classList.add("hidden");
          rawPrompts = MOCK_DATA;
          dataSource = "fallback";
          showSyncStatus(false);
          deriveFilterOptions();
          renderFilterButtons();
          applyFilters();
        }
      });
    }

    // Rebuild the 主軸 / 模式 / AI工具 pill lists from whatever dataset is currently loaded,
    // so filters always reflect the live Google Sheet content rather than a hardcoded list.
    function deriveFilterOptions() {
      if (dataSource !== "sheet") return; // keep curated defaults for the fallback dataset

      const cats = new Set();
      const modes = new Set();
      const tools = new Set();

      rawPrompts.forEach(p => {
        if (p.category) cats.add(p.category);
        if (p.mode) modes.add(p.mode);
        (p.tools || []).forEach(t => t && tools.add(t));
      });

      if (cats.size) CATEGORIES = ["全部", ...Array.from(cats)];
      if (modes.size) MODES = ["全部", ...Array.from(modes)];
      if (tools.size) TOOLS = ["全部", ...Array.from(tools)];

      if (!CATEGORIES.includes(selectedCategory)) selectedCategory = "全部";
      if (!MODES.includes(selectedMode)) selectedMode = "全部";
      if (!TOOLS.includes(selectedTool)) selectedTool = "全部";
    }

    function showSyncStatus(success, count) {
      const statusEl = document.getElementById("sync-status");
      const now = new Date();
      const timeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

      statusEl.classList.remove("hidden");
      statusEl.classList.add("inline-flex");

      if (success) {
        statusEl.innerHTML = `<i class="fa-solid fa-circle text-emerald-500 text-[6px] mr-1.5"></i>已與 Google Sheet 同步・${timeStr}`;
      } else {
        statusEl.innerHTML = `<i class="fa-solid fa-circle text-amber-500 text-[6px] mr-1.5"></i>Google Sheet 無法讀取，顯示預設資料`;
      }
    }

    function renderFilterButtons() {
      // Categories
      const catContainer = document.getElementById("filter-category");
      catContainer.innerHTML = CATEGORIES.map(cat => `
        <button 
          data-type="category" 
          data-val="${escapeHtml(cat)}" 
          class="filter-pill border px-3 py-1 text-xs sm:text-sm rounded-full transition font-medium ${cat === selectedCategory ? 'bg-[var(--ink)] text-white border-[var(--ink)] font-semibold' : 'bg-[var(--card)] text-[var(--ink-soft)] border-[var(--hairline)] hover:border-[var(--gold)]'}"
        >
          ${escapeHtml(cat)}
        </button>
      `).join('');

      // Modes
      const modeContainer = document.getElementById("filter-mode");
      modeContainer.innerHTML = MODES.map(m => `
        <button 
          data-type="mode" 
          data-val="${escapeHtml(m)}" 
          class="filter-pill border px-3 py-1 text-xs sm:text-sm rounded-full transition font-medium ${m === selectedMode ? 'bg-[var(--ink)] text-white border-[var(--ink)] font-semibold' : 'bg-[var(--card)] text-[var(--ink-soft)] border-[var(--hairline)] hover:border-[var(--gold)]'}"
        >
          ${escapeHtml(m)}
        </button>
      `).join('');

      // Tools
      const toolContainer = document.getElementById("filter-tool");
      toolContainer.innerHTML = TOOLS.map(t => `
        <button 
          data-type="tool" 
          data-val="${escapeHtml(t)}" 
          class="filter-pill border px-3 py-1 text-xs sm:text-sm rounded-full transition font-medium ${t === selectedTool ? 'bg-[var(--ink)] text-white border-[var(--ink)] font-semibold' : 'bg-[var(--card)] text-[var(--ink-soft)] border-[var(--hairline)] hover:border-[var(--gold)]'}"
        >
          ${escapeHtml(t)}
        </button>
      `).join('');

      // Add click handlers
      document.querySelectorAll('.filter-pill').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const type = e.target.getAttribute('data-type');
          const val = e.target.getAttribute('data-val');

          if (type === 'category') selectedCategory = val;
          if (type === 'mode') selectedMode = val;
          if (type === 'tool') selectedTool = val;

          renderFilterButtons();
          applyFilters();
        });
      });
    }

    function applyFilters() {
      filteredPrompts = rawPrompts.filter(item => {
        // Category filter
        if (selectedCategory !== "全部" && item.category !== selectedCategory) return false;
        
        // Mode filter
        if (selectedMode !== "全部" && item.mode !== selectedMode) return false;

        // Tool filter
        if (selectedTool !== "全部" && !item.tools.includes(selectedTool)) return false;

        // Search Query
        if (searchQuery.trim() !== "") {
          const query = searchQuery.toLowerCase();
          const matchTitle = item.title.toLowerCase().includes(query);
          const matchContent = item.content.toLowerCase().includes(query);
          const matchSub = (item.subCategory || "").toLowerCase().includes(query);
          const matchCat = (item.category || "").toLowerCase().includes(query);
          return matchTitle || matchContent || matchSub || matchCat;
        }

        return true;
      });

      renderPromptsGrid();
    }

    function renderPromptsGrid() {
      const grid = document.getElementById("prompts-grid");
      const emptyState = document.getElementById("empty-state");
      const countEl = document.getElementById("prompt-count");

      countEl.textContent = filteredPrompts.length;

      if (filteredPrompts.length === 0) {
        grid.innerHTML = "";
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");

      grid.innerHTML = filteredPrompts.map((item, index) => {
        // Tag styles — muted consulting palette
        const categoryTagHtml = `<span class="bg-[var(--ink)] text-white text-[11px] font-medium px-2 py-0.5 rounded-md">${escapeHtml(item.category || '筆記')}</span>`;
        const modeTagHtml = `<span class="bg-[var(--gold-tint)] text-[var(--gold-deep)] border border-[var(--gold)]/30 text-[11px] font-medium px-2 py-0.5 rounded-md">${escapeHtml(item.mode || 'AI 助理')}</span>`;
        
        const toolsTagsHtml = (item.tools || []).map(t => {
          return `<span class="bg-[var(--ivory)] text-[var(--ink-soft)] border border-[var(--hairline)] text-[11px] font-medium px-2 py-0.5 rounded-md">${escapeHtml(t)}</span>`;
        }).join('');

        return `
          <div onclick="openPromptModal('${item.id}')" class="bg-[var(--card)] rounded-md border border-[var(--hairline)] shadow-sm hover:shadow-md transition-all duration-200 card-gold-rule flex flex-col justify-between overflow-hidden cursor-pointer">
            <div class="p-4 pt-5 flex-grow">
              
              <!-- Card Tags -->
              <div class="flex flex-wrap gap-1.5 mb-3">
                ${categoryTagHtml}
                ${modeTagHtml}
                ${toolsTagsHtml}
              </div>

              <!-- Eyebrow: sequence number + sub-category -->
              <div class="flex items-baseline gap-2 mb-0.5">
                <span class="font-accent italic text-[var(--gold)] text-sm">N&deg; ${escapeHtml(item.id)}</span>
                <span class="text-[11px] font-medium text-[var(--muted)] tracking-wide">
                  ${escapeHtml(item.subCategory || '筆記整理')}
                </span>
              </div>

              <!-- Title -->
              <h3 class="font-display text-base font-bold text-[var(--ink)] mb-3 line-clamp-1">
                ${escapeHtml(item.title)}
              </h3>

              <!-- Content Preview Box -->
              <div class="bg-[var(--ivory)]/70 rounded-md p-3 border border-[var(--hairline)] max-h-52 overflow-y-auto custom-scrollbar">
                <p class="text-xs text-[var(--ink-soft)] whitespace-pre-wrap font-sans leading-relaxed select-text">
                  ${escapeHtml(item.content)}
                </p>
              </div>

            </div>

            <!-- Footer Action Buttons -->
            <div class="px-4 pb-4 pt-1 flex items-center gap-2" onclick="event.stopPropagation()">
              <button 
                onclick="copyPrompt('${item.id}')"
                class="flex-grow bg-[var(--ink)] hover:bg-[var(--gold-deep)] active:bg-[var(--gold-deep)] text-white font-medium text-xs sm:text-sm py-2.5 px-3 rounded-md transition flex items-center justify-center gap-1.5 shadow-sm"
              >
                <i class="fa-solid fa-copy text-xs"></i>
                <span>複製 Prompt</span>
              </button>
              
              <a 
                href="https://docs.google.com/spreadsheets/d/1C9xqJVVjnlpogR7PcRk_myY2Vc0qvz55A1ZlbKLvj5k/edit?gid=1480282197#gid=1480282197" 
                target="_blank" 
                rel="noopener noreferrer"
                title="開啟 Google Sheet 編輯資料"
                class="w-10 h-10 flex items-center justify-center bg-[var(--card)] border border-[var(--hairline)] hover:border-[var(--gold)] hover:text-[var(--gold-deep)] rounded-md text-[var(--muted)] transition"
              >
                <i class="fa-solid fa-pencil text-xs"></i>
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function setupEventListeners() {
      // Search input
      const searchInput = document.getElementById("search-input");
      const clearBtn = document.getElementById("clear-search");

      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        if (searchQuery) {
          clearBtn.classList.remove("hidden");
        } else {
          clearBtn.classList.add("hidden");
        }
        applyFilters();
      });

      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        searchQuery = "";
        clearBtn.classList.add("hidden");
        applyFilters();
      });

      // Reset filters button in empty state
      document.getElementById("reset-filters-btn").addEventListener("click", () => {
        selectedCategory = "全部";
        selectedMode = "全部";
        selectedTool = "全部";
        searchQuery = "";
        searchInput.value = "";
        clearBtn.classList.add("hidden");
        renderFilterButtons();
        applyFilters();
      });

      // Sync button
      document.getElementById("sync-sheet-btn").addEventListener("click", () => {
        fetchPromptData();
        showToast("正在從 Google Sheet 重新整理資料…");
      });

      // Top nav tabs (visual state only — all point at the same prompt library for now)
      ["tab-single", "tab-flow", "tab-workflow"].forEach(id => {
        document.getElementById(id).addEventListener("click", () => {
          ["tab-single", "tab-flow", "tab-workflow"].forEach(otherId => {
            const btn = document.getElementById(otherId);
            btn.classList.toggle("active", otherId === id);
            btn.classList.toggle("text-[var(--ink)]", otherId === id);
            btn.classList.toggle("text-[var(--muted)]", otherId !== id);
          });
        });
      });

      // Modal close handlers
      document.getElementById("close-modal-btn").addEventListener("click", closeModal);
      document.getElementById("modal-backdrop").addEventListener("click", (e) => {
        if (e.target.id === "modal-backdrop") closeModal();
      });
    }

    // Copy Prompt Function
    function copyPrompt(promptId) {
      const prompt = rawPrompts.find(p => p.id === promptId);
      if (!prompt) return;

      copyToClipboard(prompt.content);
      showToast(`已複製「${prompt.title}」提示詞！`);
    }

    // Modal Details View
    let currentModalPrompt = null;
    function openPromptModal(promptId) {
      const prompt = rawPrompts.find(p => p.id === promptId);
      if (!prompt) return;

      currentModalPrompt = prompt;

      document.getElementById("modal-title").textContent = prompt.title;
      document.getElementById("modal-category").textContent = prompt.subCategory || prompt.category;
      document.getElementById("modal-content").textContent = prompt.content;

      // Modal Tags
      const tagsContainer = document.getElementById("modal-tags");
      tagsContainer.innerHTML = `
        <span class="bg-[var(--ink)] text-white text-xs font-medium px-2.5 py-0.5 rounded-md">${escapeHtml(prompt.category)}</span>
        <span class="bg-[var(--gold-tint)] text-[var(--gold-deep)] border border-[var(--gold)]/30 text-xs font-medium px-2.5 py-0.5 rounded-md">${escapeHtml(prompt.mode)}</span>
        ${(prompt.tools || []).map(t => `<span class="bg-[var(--ivory)] text-[var(--ink-soft)] border border-[var(--hairline)] text-xs font-medium px-2.5 py-0.5 rounded-md">${escapeHtml(t)}</span>`).join('')}
      `;

      // Modal Copy Button
      document.getElementById("modal-copy-btn").onclick = () => {
        copyToClipboard(prompt.content);
        showToast("已成功複製完整 Prompt！");
      };

      const backdrop = document.getElementById("modal-backdrop");
      const box = document.getElementById("modal-box");

      backdrop.classList.remove("hidden");
      setTimeout(() => {
        backdrop.classList.remove("opacity-0");
        box.classList.remove("scale-95");
      }, 10);
    }

    function closeModal() {
      const backdrop = document.getElementById("modal-backdrop");
      const box = document.getElementById("modal-box");

      backdrop.classList.add("opacity-0");
      box.classList.add("scale-95");
      setTimeout(() => {
        backdrop.classList.add("hidden");
      }, 200);
    }

    // Utility: Copy to Clipboard fallback
    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
          document.execCommand('copy');
        } catch (err) {
          console.error('Fallback copy failed', err);
        }
        document.body.removeChild(textarea);
      }
    }

    // Utility: Show Toast
    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toast-msg");
      
      toastMsg.textContent = msg;
      toast.classList.remove("translate-y-20", "opacity-0");

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0");
      }, 2500);
    }

    // Utility: HTML Escape
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
