<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI工作站 - 提示詞庫</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PapaParse for Google Sheets CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f4f8;
    }
    
    /* Custom Scrollbar for Prompt Text Preview */
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f5;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Gradient accent line on top of card */
    .card-gradient-border {
      position: relative;
    }
    .card-gradient-border::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6);
      border-top-left-radius: 1rem;
      border-top-right-radius: 1rem;
    }
  </style>
</head>
<body class="text-slate-700 antialiased min-h-screen flex flex-col pb-12">

  <!-- Top Navigation Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🚀</span>
        <h1 class="text-xl font-bold bg-gradient-to-r from-purple-700 to-indigo-600 bg-clip-text text-transparent">
          AI工作站
        </h1>
      </div>

      <!-- Main Navigation Tabs -->
      <nav class="flex items-center space-x-1 sm:space-x-2 bg-slate-100 p-1 rounded-xl">
        <button id="tab-single" class="px-3 sm:px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white shadow-sm transition-all flex items-center space-x-1.5">
          <i class="fa-solid fa-folder-closed text-xs"></i>
          <span>單項提示詞</span>
        </button>
        <button id="tab-flow" class="px-3 sm:px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:text-slate-900 transition-all flex items-center space-x-1.5">
          <i class="fa-solid fa-bolt text-xs text-amber-500"></i>
          <span>流程提示詞</span>
        </button>
        <button id="tab-workflow" class="px-3 sm:px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:text-slate-900 transition-all flex items-center space-x-1.5">
          <i class="fa-solid fa-folder-open text-xs text-slate-500"></i>
          <span>工作流檔案</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 flex-grow w-full">

    <!-- Search Bar -->
    <div class="mb-5">
      <div class="relative rounded-2xl shadow-sm">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <input 
          type="text" 
          id="search-input" 
          placeholder="搜尋提示詞名稱、任務或內容關鍵字..." 
          class="w-full pl-11 pr-10 py-3.5 bg-white border border-slate-200 rounded-2xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm transition text-sm sm:text-base"
        >
        <button id="clear-search" class="hidden absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- Filter Control Box -->
    <div class="bg-white border border-slate-200/80 rounded-2xl p-5 shadow-sm space-y-4 mb-6">
      
      <!-- 主軸 (Categories) -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
        <span class="text-xs sm:text-sm font-semibold text-slate-400 w-16 shrink-0">主軸</span>
        <div id="filter-category" class="flex flex-wrap gap-2">
          <!-- Filter pills injected dynamically -->
        </div>
      </div>

      <!-- 模式 (Mode) -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 border-t border-slate-100 pt-3">
        <span class="text-xs sm:text-sm font-semibold text-slate-400 w-16 shrink-0">模式</span>
        <div id="filter-mode" class="flex flex-wrap gap-2">
          <!-- Filter pills injected dynamically -->
        </div>
      </div>

      <!-- AI工具 (AI Tools) -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 border-t border-slate-100 pt-3">
        <span class="text-xs sm:text-sm font-semibold text-slate-400 w-16 shrink-0">AI工具</span>
        <div id="filter-tool" class="flex flex-wrap gap-2">
          <!-- Filter pills injected dynamically -->
        </div>
      </div>

    </div>

    <!-- Prompt Count & Status Indicator -->
    <div class="flex items-center justify-between mb-4 px-1">
      <div class="text-sm font-medium text-purple-700 flex items-center gap-2">
        <span>共 <strong id="prompt-count" class="text-indigo-600 text-base">0</strong> 個提示詞</span>
        <span id="loading-spinner" class="inline-flex items-center text-xs text-slate-400 ml-2">
          <i class="fa-solid fa-circle-notch fa-spin mr-1"></i> 資料同步中...
        </span>
      </div>
      <button id="sync-sheet-btn" class="text-xs text-slate-500 hover:text-indigo-600 flex items-center gap-1 bg-white border border-slate-200 px-2.5 py-1 rounded-lg transition hover:shadow-sm">
        <i class="fa-solid fa-rotate text-slate-400"></i> 重新載入 Google Sheet
      </button>
    </div>

    <!-- Prompt Cards Grid -->
    <div id="prompts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
      <!-- Dynamic Card Elements inserted via JavaScript -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300 my-4">
      <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
      <p class="text-slate-500 font-medium">沒有找到符合條件的提示詞</p>
      <button id="reset-filters-btn" class="mt-3 text-xs bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition">
        重設所有篩選條件
      </button>
    </div>

  </main>

  <!-- Prompt Detail Modal -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity opacity-0">
    <div id="modal-box" class="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden transform scale-95 transition-all">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <div>
          <span id="modal-category" class="text-xs font-semibold text-slate-400 block"></span>
          <h3 id="modal-title" class="text-lg font-bold text-slate-800"></h3>
        </div>
        <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="modal-tags" class="px-6 py-2 flex flex-wrap gap-1.5 border-b border-slate-100 bg-white">
        <!-- Modal tags inserted here -->
      </div>
      <div class="p-6 overflow-y-auto custom-scrollbar flex-grow bg-slate-50/50">
        <pre id="modal-content" class="whitespace-pre-wrap font-sans text-sm text-slate-700 leading-relaxed bg-white p-4 rounded-xl border border-slate-200 select-all"></pre>
      </div>
      <div class="px-6 py-3 border-t border-slate-100 bg-white flex justify-end space-x-2">
        <button id="modal-copy-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-4 py-2 rounded-xl flex items-center gap-1.5 shadow-sm transition">
          <i class="fa-regular fa-copy"></i>
          <span>複製完整 Prompt</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white text-sm px-4 py-3 rounded-xl shadow-xl flex items-center space-x-2 transform translate-y-20 opacity-0 transition-all z-50">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toast-msg">已成功複製到剪貼簿！</span>
  </div>

  <script>
    // Fallback Mock Data matching exact items in screenshot + additional items
    const MOCK_DATA = [
      {
        id: "049",
        title: "049-線上課程",
        category: "筆記",
        subCategory: "筆記整理",
        mode: "AI 助理",
        tools: ["ChatGPT", "Gemini AI"],
        content: `【角色設定】
你是一位專精於「學習科學」與「知識管理」的 AI 助教。擅長將混亂的課程投影影片（截圖 PDF）轉化為具備邏輯、易於日後複習的高價值筆記。

【任務目標】
請分析我上傳的 PDF 檔案（由線上課程截圖組成），執行 OCR 文字辨識並進行深度擷取。請針對每一組邏輯相關的內容，自動判斷最適合的整理格式：

觀念/理論型內容：使用「黃金圈法則 (Why/How/What)」解析。`
      },
      {
        id: "050",
        title: "050-線上課程",
        category: "筆記",
        subCategory: "筆記整理",
        mode: "AI 助理",
        tools: ["ChatGPT", "Gemini AI"],
        content: `【角色設定】
你是一位專精於「學習科學」與「知識管理」的 AI 助教。擅長將混亂的課程投影影片（截圖 PDF）轉化為具備邏輯、易於日後複習的高價值筆記。

【任務目標】
請分析我上傳的 PDF 檔案（由線上課程截圖組成），進行文字辨識與整理。請針對內容，自動判斷最適合的整理格式。

並於最後一段，擷取職場可以應用的三個重點，以條列式來呈現。`
      },
      {
        id: "051",
        title: "051-長篇文章",
        category: "筆記",
        subCategory: "筆記精煉",
        mode: "AI 協做",
        tools: ["ChatGPT", "Gemini AI"],
        content: `為這一篇長篇文章，進行以下四個步驟，每一個步驟都要提供給文章與標示出來：
第1、請為這篇長文生成一份體短摘要。
第2、請基於上一個摘要，不要遺漏任何專有名詞、數字或關鍵人物，重新生成一份摘要。
第3、現在，請將摘要中每一句話都濃縮成更簡潔的表達，同時保留所有事實，讓它擴起來更像新聞標題。
第4、最後，請確保摘要能獨立解釋所有提到的概念，無需參照原文。

### 長文如下：`
      },
      {
        id: "052",
        title: "052-提取練習",
        category: "筆記",
        subCategory: "筆記精煉",
        mode: "AI 協思",
        tools: ["ChatGPT", "Gemini AI", "Claude AI"],
        content: `我剛讀完了關於 [填入具體段落標題] 的內容。現在請幫我進行深度研磨：

1-底層邏輯拷問：針對這段內容的「運作原理」向我提問，測試我是否理解了「為什麼有效」，而非只是記住步驟。

2-隱喻轉化：如果這段概念有複雜的故事，請幫我將其轉化為一個 50 字以內的「關鍵隱喻」或「原則案例」。

3-邏輯連動：這段內容與附件中之前的 [填入章節]`
      },
      {
        id: "053",
        title: "053-Python 腳本寫作",
        category: "程式",
        subCategory: "程式開發",
        mode: "AI 助理",
        tools: ["ChatGPT", "Claude AI"],
        content: `你是一位資深的 Python 全棧工程師。請幫我設計一個具備完整錯誤處理與註解的數據處理腳本。

【需求】
1. 讀取 CSV / Excel 檔案
2. 清理缺失值與異常數據
3. 輸出乾淨的 JSON 數據結構`
      },
      {
        id: "054",
        title: "054-簡報大綱設計",
        category: "簡報",
        subCategory: "簡報企劃",
        mode: "AI 協做",
        tools: ["NotebookLM", "Gemini AI"],
        content: `【任務】
為一場 15 分鐘的商業提案簡報擬定架構大綱。

【簡報目標】
向客戶高層展示新產品的投資回報率 (ROI) 與導入時程。請以 10 頁 Slide 為限，每頁說明「標題、核心訊息、建議視覺呈現元素」。`
      }
    ];

    // Google Sheet URL from prompt
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1C9xqJVVjnlpogR7PcRk_myY2Vc0qvz55A1ZlbKLvj5k/gviz/tq?tqx=out:csv&gid=1480282197";

    // Application state
    let rawPrompts = [];
    let filteredPrompts = [];
    let selectedCategory = "全部";
    let selectedMode = "全部";
    let selectedTool = "全部";
    let searchQuery = "";

    // Categories lists
    const CATEGORIES = ["全部", "寫作", "心圖", "示範", "校正", "秘訣", "程式", "筆記", "貼文", "整理", "簡報"];
    const MODES = ["全部", "AI 助理", "AI 協做", "AI 協思"];
    const TOOLS = ["全部", "ChatGPT", "Gemini Canvas", "NotebookLM", "Gemini AI", "Claude AI"];

    document.addEventListener("DOMContentLoaded", () => {
      renderFilterButtons();
      fetchPromptData();
      setupEventListeners();
    });

    // Fetch data from Google Sheets or fallback
    function fetchPromptData() {
      const spinner = document.getElementById("loading-spinner");
      spinner.classList.remove("hidden");

      Papa.parse(GOOGLE_SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          spinner.classList.add("hidden");
          if (results.data && results.data.length > 0 && results.data[0].title || results.data[0].Title || results.data[0]["提示詞名稱"]) {
            // Process sheet data
            rawPrompts = results.data.map((row, idx) => {
              const title = row['title'] || row['Title'] || row['提示詞名稱'] || row['名稱'] || `提示詞-${idx+1}`;
              const category = row['category'] || row['Category'] || row['主軸'] || "筆記";
              const subCategory = row['subCategory'] || row['SubCategory'] || row['分類'] || "通用";
              const mode = row['mode'] || row['Mode'] || row['模式'] || "AI 助理";
              const toolsStr = row['tools'] || row['Tools'] || row['AI工具'] || row['工具'] || "ChatGPT,Gemini AI";
              const content = row['content'] || row['Content'] || row['提示詞內容'] || row['內容'] || "";
              
              const tools = typeof toolsStr === 'string' ? toolsStr.split(/[,/、]\s*/).map(t => t.trim()) : [toolsStr];

              return {
                id: String(idx + 1).padStart(3, '0'),
                title,
                category,
                subCategory,
                mode,
                tools,
                content
              };
            });
          } else {
            console.log("Sheet empty or structure unreadable, using fallback dataset.");
            rawPrompts = MOCK_DATA;
          }
          applyFilters();
        },
        error: (err) => {
          console.warn("Failed to fetch Google Sheet CSV due to network or CORS, loading preset library.", err);
          spinner.classList.add("hidden");
          rawPrompts = MOCK_DATA;
          applyFilters();
        }
      });
    }

    function renderFilterButtons() {
      // Categories
      const catContainer = document.getElementById("filter-category");
      catContainer.innerHTML = CATEGORIES.map(cat => `
        <button 
          data-type="category" 
          data-val="${cat}" 
          class="filter-pill border px-3 py-1 text-xs sm:text-sm rounded-full transition font-medium ${cat === selectedCategory ? 'bg-purple-100 text-purple-700 border-purple-300 font-semibold' : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300'}"
        >
          ${cat}
        </button>
      `).join('');

      // Modes
      const modeContainer = document.getElementById("filter-mode");
      modeContainer.innerHTML = MODES.map(m => `
        <button 
          data-type="mode" 
          data-val="${m}" 
          class="filter-pill border px-3 py-1 text-xs sm:text-sm rounded-full transition font-medium ${m === selectedMode ? 'bg-purple-100 text-purple-700 border-purple-300 font-semibold' : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300'}"
        >
          ${m}
        </button>
      `).join('');

      // Tools
      const toolContainer = document.getElementById("filter-tool");
      toolContainer.innerHTML = TOOLS.map(t => `
        <button 
          data-type="tool" 
          data-val="${t}" 
          class="filter-pill border px-3 py-1 text-xs sm:text-sm rounded-full transition font-medium ${t === selectedTool ? 'bg-purple-100 text-purple-700 border-purple-300 font-semibold' : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300'}"
        >
          ${t}
        </button>
      `).join('');

      // Add click handlers
      document.querySelectorAll('.filter-pill').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const type = e.target.getAttribute('data-type');
          const val = e.target.getAttribute('data-val');

          if (type === 'category') selectedCategory = val;
          if (type === 'mode') selectedMode = val;
          if (type === 'tool') selectedTool = val;

          renderFilterButtons();
          applyFilters();
        });
      });
    }

    function applyFilters() {
      filteredPrompts = rawPrompts.filter(item => {
        // Category filter
        if (selectedCategory !== "全部" && item.category !== selectedCategory) return false;
        
        // Mode filter
        if (selectedMode !== "全部" && item.mode !== selectedMode) return false;

        // Tool filter
        if (selectedTool !== "全部" && !item.tools.includes(selectedTool)) return false;

        // Search Query
        if (searchQuery.trim() !== "") {
          const query = searchQuery.toLowerCase();
          const matchTitle = item.title.toLowerCase().includes(query);
          const matchContent = item.content.toLowerCase().includes(query);
          const matchSub = (item.subCategory || "").toLowerCase().includes(query);
          const matchCat = (item.category || "").toLowerCase().includes(query);
          return matchTitle || matchContent || matchSub || matchCat;
        }

        return true;
      });

      renderPromptsGrid();
    }

    function renderPromptsGrid() {
      const grid = document.getElementById("prompts-grid");
      const emptyState = document.getElementById("empty-state");
      const countEl = document.getElementById("prompt-count");

      countEl.textContent = filteredPrompts.length;

      if (filteredPrompts.length === 0) {
        grid.innerHTML = "";
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");

      grid.innerHTML = filteredPrompts.map((item, index) => {
        // Tag styles
        const categoryTagHtml = `<span class="bg-purple-50 text-purple-600 border border-purple-100 text-[11px] font-medium px-2 py-0.5 rounded-md">${item.category || '筆記'}</span>`;
        const modeTagHtml = `<span class="bg-indigo-50 text-indigo-600 border border-indigo-100 text-[11px] font-medium px-2 py-0.5 rounded-md">${item.mode || 'AI 助理'}</span>`;
        
        const toolsTagsHtml = (item.tools || []).map(t => {
          let bgClass = "bg-slate-100 text-slate-600";
          if (t.includes("ChatGPT")) bgClass = "bg-sky-50 text-sky-600 border border-sky-100";
          if (t.includes("Gemini")) bgClass = "bg-violet-50 text-violet-600 border border-violet-100";
          if (t.includes("Claude")) bgClass = "bg-purple-50 text-purple-600 border border-purple-100";
          return `<span class="${bgClass} text-[11px] font-medium px-2 py-0.5 rounded-md">${t}</span>`;
        }).join('');

        return `
          <div class="bg-white rounded-2xl border border-slate-200/90 shadow-sm hover:shadow-md transition-all duration-200 card-gradient-border flex flex-col justify-between overflow-hidden">
            <div class="p-4 pt-5 flex-grow">
              
              <!-- Card Tags -->
              <div class="flex flex-wrap gap-1.5 mb-3">
                ${categoryTagHtml}
                ${modeTagHtml}
                ${toolsTagsHtml}
              </div>

              <!-- Sub-Category Label -->
              <div class="text-[11px] font-medium text-slate-400 tracking-wide mb-0.5">
                ${item.subCategory || '筆記整理'}
              </div>

              <!-- Title -->
              <h3 class="text-base font-bold text-slate-800 mb-3 line-clamp-1">
                ${item.title}
              </h3>

              <!-- Content Preview Box -->
              <div class="bg-slate-50/80 rounded-xl p-3 border border-slate-100 max-h-52 overflow-y-auto custom-scrollbar">
                <p class="text-xs text-slate-600 whitespace-pre-wrap font-sans leading-relaxed select-text">
                  ${escapeHtml(item.content)}
                </p>
              </div>

            </div>

            <!-- Footer Action Buttons -->
            <div class="px-4 pb-4 pt-1 flex items-center gap-2">
              <button 
                onclick="copyPrompt('${item.id}')"
                class="flex-grow bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-xs sm:text-sm py-2.5 px-3 rounded-xl transition flex items-center justify-center gap-1.5 shadow-sm"
              >
                <i class="fa-solid fa-copy text-xs"></i>
                <span>複製 Prompt</span>
              </button>
              
              <a 
                href="https://docs.google.com/spreadsheets/d/1C9xqJVVjnlpogR7PcRk_myY2Vc0qvz55A1ZlbKLvj5k/edit?gid=1480282197#gid=1480282197" 
                target="_blank" 
                rel="noopener noreferrer"
                title="開啟 Google Sheet 編輯資料"
                class="w-10 h-10 flex items-center justify-center bg-white border border-slate-200 hover:border-amber-400 hover:text-amber-500 rounded-xl text-slate-400 transition"
              >
                <i class="fa-solid fa-pencil text-xs text-amber-500"></i>
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function setupEventListeners() {
      // Search input
      const searchInput = document.getElementById("search-input");
      const clearBtn = document.getElementById("clear-search");

      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        if (searchQuery) {
          clearBtn.classList.remove("hidden");
        } else {
          clearBtn.classList.add("hidden");
        }
        applyFilters();
      });

      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        searchQuery = "";
        clearBtn.classList.add("hidden");
        applyFilters();
      });

      // Reset filters button in empty state
      document.getElementById("reset-filters-btn").addEventListener("click", () => {
        selectedCategory = "全部";
        selectedMode = "全部";
        selectedTool = "全部";
        searchQuery = "";
        searchInput.value = "";
        clearBtn.classList.add("hidden");
        renderFilterButtons();
        applyFilters();
      });

      // Sync button
      document.getElementById("sync-sheet-btn").addEventListener("click", () => {
        fetchPromptData();
        showToast("已從 Google Sheet 重新整理數據");
      });

      // Modal close handlers
      document.getElementById("close-modal-btn").addEventListener("click", closeModal);
      document.getElementById("modal-backdrop").addEventListener("click", (e) => {
        if (e.target.id === "modal-backdrop") closeModal();
      });
    }

    // Copy Prompt Function
    function copyPrompt(promptId) {
      const prompt = rawPrompts.find(p => p.id === promptId);
      if (!prompt) return;

      copyToClipboard(prompt.content);
      showToast(`已複製「${prompt.title}」提示詞！`);
    }

    // Modal Details View
    let currentModalPrompt = null;
    function openPromptModal(promptId) {
      const prompt = rawPrompts.find(p => p.id === promptId);
      if (!prompt) return;

      currentModalPrompt = prompt;

      document.getElementById("modal-title").textContent = prompt.title;
      document.getElementById("modal-category").textContent = prompt.subCategory || prompt.category;
      document.getElementById("modal-content").textContent = prompt.content;

      // Modal Tags
      const tagsContainer = document.getElementById("modal-tags");
      tagsContainer.innerHTML = `
        <span class="bg-purple-50 text-purple-600 border border-purple-100 text-xs font-medium px-2.5 py-0.5 rounded-md">${prompt.category}</span>
        <span class="bg-indigo-50 text-indigo-600 border border-indigo-100 text-xs font-medium px-2.5 py-0.5 rounded-md">${prompt.mode}</span>
        ${(prompt.tools || []).map(t => `<span class="bg-sky-50 text-sky-600 border border-sky-100 text-xs font-medium px-2.5 py-0.5 rounded-md">${t}</span>`).join('')}
      `;

      // Modal Copy Button
      document.getElementById("modal-copy-btn").onclick = () => {
        copyToClipboard(prompt.content);
        showToast("已成功複製完整 Prompt！");
      };

      const backdrop = document.getElementById("modal-backdrop");
      const box = document.getElementById("modal-box");

      backdrop.classList.remove("hidden");
      setTimeout(() => {
        backdrop.classList.remove("opacity-0");
        box.classList.remove("scale-95");
      }, 10);
    }

    function closeModal() {
      const backdrop = document.getElementById("modal-backdrop");
      const box = document.getElementById("modal-box");

      backdrop.classList.add("opacity-0");
      box.classList.add("scale-95");
      setTimeout(() => {
        backdrop.classList.add("hidden");
      }, 200);
    }

    // Utility: Copy to Clipboard fallback
    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
          document.execCommand('copy');
        } catch (err) {
          console.error('Fallback copy failed', err);
        }
        document.body.removeChild(textarea);
      }
    }

    // Utility: Show Toast
    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toast-msg");
      
      toastMsg.textContent = msg;
      toast.classList.remove("translate-y-20", "opacity-0");

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0");
      }, 2500);
    }

    // Utility: HTML Escape
    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
